    <!-- White phone status bar and browser chrome (top and bottom strips). -->
    <meta name="theme-color" content="#0f0b18" />
    <!--
      Opened from the Home Screen, the site runs without browser bars. The status bar
      uses the default (opaque, theme-coloured) style: on iOS 26, black-translucent
      makes iOS blur the top of the page and leaves a gap at the bottom (WebKit bug 301108).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
